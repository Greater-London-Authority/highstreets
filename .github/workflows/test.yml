name: CI

on:
  push:
    branches:
      - aws-hsds
      - main
  pull_request:
    branches:
      - aws-hsds
      - main

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --no-interaction
        env:
          GITHUB_ACCESS_TOKEN_GLAPY: ${{ secrets.GLAPY_ACCESS_TOKEN }}

      - name: Check formatting with black
        run: poetry run black --check highstreets/ tests/
        continue-on-error: true

      - name: Lint with flake8
        run: poetry run flake8 highstreets/ --count --statistics
        continue-on-error: true

      - name: Run tests
        run: poetry run pytest tests/test_imports.py tests/test_core_classes.py -v --tb=short
