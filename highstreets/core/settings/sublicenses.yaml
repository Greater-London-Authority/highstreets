# Comprehensive Sublicense Configuration
# This YAML file defines all sublicense agreements and their data requirements
# Supports database-side filtering and flexible data source configuration

# Global configuration
config:
  base_schema: "gisapdata"
  date_formats:
    mastercard_3hourly: "count_date"
    mastercard_weekly: "week_start" 
    bt_footfall: "count_date"
    bt_hex: "count_date"
  
  # Database table mappings
  data_sources:
    bt_footfall:
      aggregated_tables:
        bespoke: "econ_busyness_bt_bespokes_3hourly_counts"
        bid: "econ_busyness_bt_bids_3hourly_counts"
        towncentre: "econ_busyness_bt_towncentres_3hourly_counts"
        highstreet: "econ_busyness_bt_highstreets_3hourly_counts"
      raw_table: "bt_footfall_tfl_hex_3hourly"
      lookup_tables:
        hex_bid: "econ_busyness_hex_bid_lookup"
        hex_towncentre: "econ_busyness_hex_towncentre_lookup"
        hex_bespoke: "econ_busyness_hex_bespoke_lookup"
        hex_highstreet: "econ_busyness_hex_highstreet_lookup"
    
    mastercard_3hourly:
      aggregated_tables:
        bespoke: "econ_busyness_mcard_bespokes_3hourly_txn"
        bid: "econ_busyness_mcard_bids_3hourly_txn"
        towncentre: "econ_busyness_mcard_towncentres_3hourly_txn"
        highstreet: "econ_busyness_mcard_highstreets_3hourly_txn"
      raw_table: "econ_busyness_mrli_3hourly_adj"
      lookup_tables:
        quad_bid: "econ_busyness_mcard_BIDs_quad_lookup"
        quad_towncentre: "econ_busyness_mcard_TownCentres_quad_lookup"
        quad_bespoke: "econ_busyness_mcard_bespoke_quad_lookup"
        quad_highstreet: "econ_busyness_mcard_Highstreets_quad_lookup"
    
    mastercard_weekly:
      aggregated_tables:
        bespoke: "econ_busyness_mcard_bespoke_txn"
        bid: "econ_busyness_mcard_bids_txn"
        towncentre: "econ_busyness_mcard_towncentres_txn"
        highstreet: "econ_busyness_mcard_highstreets_txn"
        borough: "econ_busyness_mcard_boroughs_txn"
        caz: "econ_busyness_mcard_caz_txn"
        msoa: "econ_busyness_mcard_msoas_txn"
        inner_outer: "econ_busyness_mcard_inner_outer_txn"
        london: "econ_busyness_mcard_london_txn"
      yoy_tables:
        bespoke: "econ_busyness_mcard_bespoke_yoy"
        bid: "econ_busyness_mcard_bids_yoy"
        towncentre: "econ_busyness_mcard_towncentres_yoy"
        highstreet: "econ_busyness_mcard_highstreets_yoy"
        borough: "econ_busyness_mcard_boroughs_yoy"
        caz: "econ_busyness_mcard_caz_yoy"
        msoa: "econ_busyness_mcard_msoas_yoy"
        inner_outer: "econ_busyness_mcard_inner_outer_yoy"
        london: "econ_busyness_mcard_london_yoy"
    
    mastercard_weekly_intl:
      aggregated_tables:
        bespoke: "econ_busyness_mcard_bespoke_intl_txn"
        bid: "econ_busyness_mcard_bids_intl_txn"
        towncentre: "econ_busyness_mcard_towncentres_intl_txn"
        highstreet: "econ_busyness_mcard_highstreets_intl_txn"
        caz: "econ_busyness_mcard_caz_intl_txn"
        msoa: "econ_busyness_mcard_msoas_intl_txn"

    bt_daily:
      aggregated_tables:
        all: "econ_busyness_bt_daily_agg_cust_raw"
      raw_table: "econ_busyness_bt_daily_agg_cust_raw"
      # add lookup_tables if needed

  # Define formatting ONLY where you want it applied
  data_formatting:
    bt_footfall:
      add_apostrophe_columns: ["hours"]
    bt_hex:
      column_renames:
        time_indicator: "hours"
      add_apostrophe_columns: ["hours"]
    mastercard_3hourly:
      add_apostrophe_columns: ["hours"]


# Sublicense Agreements
sublicenses:
  sublicense-test-hsds:
    slug: "hsds-sublicense-test"
    description: "Testing the Automation of the Sublicense Manager"
    contact: "test@example.com"
    status: "active"
    
    data_sources:
      - bt_footfall
      - mastercard_3hourly
      - mastercard_weekly
      - mastercard_weekly_intl
      - bt_daily
    
    filters:
      bespoke_area_ids: [112, 113, 114, 115, 116, 117, 118, 197]
    
    query_templates:
      bt_footfall_bespoke: |
        SELECT * FROM {schema}.econ_busyness_bt_bespokes_3hourly_counts 
        WHERE bespoke_area_id IN ({bespoke_area_ids})
      
      mastercard_3hourly_bespoke: |
        SELECT * FROM {schema}.econ_busyness_mcard_bespokes_3hourly_txn 
        WHERE bespoke_area_id IN ({bespoke_area_ids})
      
      mastercard_weekly_bespoke: |
        SELECT * FROM {schema}.econ_busyness_mcard_bespoke_txn 
        WHERE bespoke_area_id::int IN ({bespoke_area_ids})
      
      mastercard_weekly_bespoke_yoy: |
        SELECT * FROM {schema}.econ_busyness_mcard_bespoke_yoy 
        WHERE bespoke_area_id::int IN ({bespoke_area_ids})
      
      bt_daily: |
        SELECT * FROM {schema}.econ_busyness_bt_daily_agg_cust_raw
        WHERE poi_type = 'bids' AND poi_name = 'Heart of London'
      
      mastercard_weekly_bespoke_intl: |
        SELECT * FROM {schema}.econ_busyness_mcard_bespoke_intl_txn 
        WHERE bespoke_area_id::int IN ({bespoke_area_ids})
    
    output_configs:
      bt_footfall:
        resource_title: "colliers_hsds_bt_footfall_3hourly_counts.csv"
        file_path: "bt/sublicense_test/processed/bespoke/Colliers agreement - Holba sites/"
        custom_date_column: "count_date"
      
      mastercard_3hourly:
        resource_title: "colliers_hsds_mcard_3hourly_txn.csv"
        file_path: "mastercard/sublicense_test/mrli_3hourly/processed/bespoke/Colliers agreement - Holba sites/"
        custom_date_column: "count_date"
      
      mastercard_weekly:
        resource_title: "colliers_hsds_mcard_weekly_txn.csv"
        file_path: "mastercard/sublicense_test/weekly/processed/bespoke/Colliers agreement - Holba sites/"
        custom_date_column: "week_start"
      
      mastercard_weekly_bespoke_yoy:
        resource_title: "colliers_hsds_mcard_weekly_yoy.csv"
        file_path: "mastercard/sublicense_test/weekly/processed/bespoke/Colliers agreement - Holba sites/"
        custom_date_column: "week_start"

      bt_daily:
        resource_title: "colliers_bt_daily_agg_counts.csv"
        file_path: "bt/sublicense_test/processed/daily/Colliers agreement - Holba sites/"
        custom_date_column: "count_date"
      
      mastercard_weekly_bespoke_intl:
        resource_title: "colliers_mcard_weekly_intl_txn.csv"
        file_path: "mastercard/sublicense_test/weekly/processed/bespoke/Colliers agreement - Holba sites/"
        custom_date_column: "week_start"
  
  colliers-hsds:
    slug: "colliers---hsds"
    description: "Colliers HSDS sublicense agreement for HOLBA sites"
    contact: "colliers_team@example.com"
    status: "active"
    
    data_sources:
      - bt_footfall
      - mastercard_3hourly
