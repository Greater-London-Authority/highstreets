[tool.poetry]
name = "highstreets"
version = "0.1.0"
description = "HSDS Data Pipeline"
authors = ["Anupam Bose <anupam.bose@london.gov.uk>"]
license = "MIT"
repository = "https://github.com/Greater-London-Authority/highstreets"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<3.12"
pandas = "^1.4.2"
numpy = "^1.22.3"
python-dotenv = "^0.20.0"
openpyxl = "^3.0.9"
sqlalchemy = "^2.0.4"
psycopg2-binary = "^2.9.5"
pydantic = "^1.10.7"
pandera = "^0.13.4"
tqdm = "^4.64.1"
requests = "^2.27.1"
geopandas = "^0.9.0"
geoalchemy2 = "^0.13.3"
psycopg2 = "^2.8.6"
glapy = {git = "https://github.com/Greater-London-Authority/glapy", branch = "feature/lds-update-data"}
shapely = "1.8.5"
pygeos = "^0.14"
fiona = "1.9.6"
snowflake-connector-python = "^3.0.0"
paramiko = "^3.3.1"
fsspec = "^2024.10.0"
s3fs = {extras = ["boto3"], version = ">=2023.12.0"}
boto3 = "*"
botocore = "*"
datapress = "^1.1.1"
great-expectations = "^1.11.3"
pyarrow = ">=14.0"
snowflake-sqlalchemy = "^1.9.0"

[tool.poetry.dev-dependencies]
pytest = "^7.0"
black = "^23.0"
flake8 = "^6.0"
debugpy = "^1.6.0"
pre-commit = "^2.18.1"
dill = "^0.3.4"
ipykernel = "^6.13.0"
ipython = "^8.2.0"
jupyter = "^1.0.0"
matplotlib = "^3.5.1"
scikit-learn = "^1.0.2"
scipy = "^1.8.0"
seaborn = "^0.11.2"
xgboost = "^1.6.1"

[build-system]
requires = ["poetry-core>=1.0.0", "setuptools>=57.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
load_dotenv = "dotenv:load_dotenv"